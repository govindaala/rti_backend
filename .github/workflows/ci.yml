name: Backend CI

on:
  push:
  pull_request:
    branches: ["main", "feature/supabase-postgres-integration", "feature/legal-source-crawler-foundation", "feature/legal-research-and-drafting-core"]

permissions:
  contents: read

jobs:
  test:
    name: Python परीक्षण, lint और diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: कोड checkout करें
        id: checkout
        uses: actions/checkout@v4

      - name: Python स्थापित करें
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependencies स्थापित करें
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint चलाएँ
        id: ruff
        run: |
          set -o pipefail
          mkdir -p reports
          ruff check app tests --output-format=github 2>&1 | tee reports/ruff.log

      - name: Frontend JavaScript syntax जाँचें
        id: javascript
        run: |
          set -o pipefail
          node --check web/app.js 2>&1 | tee reports/node-app.log
          node --check web/admin.js 2>&1 | tee reports/node-admin.log

      - name: परीक्षण चलाएँ — पूरा traceback और JUnit report
        id: pytest
        run: |
          mkdir -p reports
          set +e
          pytest -vv --tb=long --showlocals --junitxml=reports/junit.xml 2>&1 | tee reports/pytest.log
          test_status=${PIPESTATUS[0]}
          python scripts/ci_diagnostics.py reports/junit.xml
          diagnostic_status=$?
          if [ "$diagnostic_status" -ne 0 ]; then
            echo "::warning::JUnit diagnostic parser could not complete; see reports/pytest.log artifact."
          fi
          exit "$test_status"

      - name: Failure summary — कौन सा workflow step विफल हुआ
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          JAVASCRIPT_OUTCOME: ${{ steps.javascript.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          {
            echo "## CI diagnostic summary"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Checkout | $CHECKOUT_OUTCOME |"
            echo "| Python setup | $PYTHON_OUTCOME |"
            echo "| Dependencies | $DEPENDENCIES_OUTCOME |"
            echo "| Ruff | $RUFF_OUTCOME |"
            echo "| JavaScript syntax | $JAVASCRIPT_OUTCOME |"
            echo "| Pytest | $PYTEST_OUTCOME |"
            echo
            echo "For source-level failures, inspect the inline annotations and the uploaded `ci-diagnostics` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          for entry in "checkout:$CHECKOUT_OUTCOME" "python setup:$PYTHON_OUTCOME" "dependencies:$DEPENDENCIES_OUTCOME" "ruff:$RUFF_OUTCOME" "javascript:$JAVASCRIPT_OUTCOME" "pytest:$PYTEST_OUTCOME"; do
            case "$entry" in
              *:failure|*:cancelled|*:timed_out)
                echo "::error title=Workflow step failure::$entry"
                ;;
            esac
          done

      - name: CI logs और test report सुरक्षित करें
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
