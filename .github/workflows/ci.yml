# रिपॉजिटरी पथ: rti_backend/.github/workflows/ci.yml
name: Backend CI

on:
  push:
  pull_request:
    branches: ["main", "feature/supabase-postgres-integration", "feature/legal-source-crawler-foundation", "feature/legal-research-and-drafting-core"]

permissions:
  contents: read

jobs:
  test:
    name: Python परीक्षण और lint
    runs-on: ubuntu-latest
    steps:
      - name: कोड checkout करें
        uses: actions/checkout@v4
      - name: Python स्थापित करें
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Dependencies स्थापित करें
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint चलाएँ
        run: ruff check app tests
      - name: Frontend JavaScript syntax जाँचें
        run: node --check web/app.js && node --check web/admin.js
      - name: परीक्षण चलाएँ
        run: pytest
